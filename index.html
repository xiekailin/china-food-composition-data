<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国食物成分表</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
</head>
<body>
    <h1>中国食物成分表</h1>
    <select id="fileSelector">
        <option value="">请选择一个文件</option>
    </select>
    <table id="dataTable" class="display" style="width:100%">
        <thead>
            <tr>
                <th>食物名称</th>
                <th>能量 (kcal)</th>
                <th>蛋白质 (g)</th>
                <th>脂肪 (g)</th>
                <th>碳水化合物 (g)</th>
                <th>钠 (mg)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        $(document).ready(function () {
            // JSON 文件列表
            const files = [
                "merged-乳类及其制品-其他.json",
                "merged-乳类及其制品-奶油.json",
                "merged-乳类及其制品-奶粉.json",
                "merged-乳类及其制品-奶酪.json",
                "merged-乳类及其制品-液态乳.json",
                "merged-乳类及其制品-酸奶.json",
                "merged-其他类-其他.json",
                "merged-动物油脂类-动物油脂.json",
                "merged-坚果种子类-树坚果.json",
                "merged-坚果种子类-种子.json",
                "merged-婴幼儿食品-婴儿配方食品(乳基).json",
                "merged-婴幼儿食品-婴儿配方食品(豆基).json"
            ];

            const baseURL = "https://xiekailin.github.io/china-food-composition-data/json_data/";

            // 填充下拉菜单
            files.forEach(file => {
                const displayName = file.replace("merged-", "").replace(".json", "").replace(/-/g, " ");
                $('#fileSelector').append(`<option value="${baseURL + file}">${displayName}</option>`);
            });

            // 加载选定的 JSON 文件并显示数据
            $('#fileSelector').change(function () {
                const selectedFile = $(this).val();
                if (!selectedFile) return;

                $.getJSON(selectedFile, function (data) {
                    const tableBody = $('#dataTable tbody');
                    tableBody.empty(); // 清空表格

                    data.forEach(item => {
                        tableBody.append(`
                            <tr>
                                <td>${item.foodName || "未知"}</td>
                                <td>${item.energyKCal || "未知"}</td>
                                <td>${item.protein || "未知"}</td>
                                <td>${item.fat || "未知"}</td>
                                <td>${item.carbohydrate || "未知"}</td>
                                <td>${item.sodium || "未知"}</td>
                            </tr>
                        `);
                    });

                    // 初始化或重新加载 DataTable
                    $('#dataTable').DataTable({
                        destroy: true, // 允许重新初始化
                        paging: true,
                        searching: true
                    });
                }).fail(function () {
                    alert("无法加载文件，请检查路径或文件格式！");
                });
            });
        });
    </script>
</body>
</html>
